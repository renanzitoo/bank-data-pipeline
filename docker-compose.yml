services:

  minio:
    image: quay.io/minio/minio:latest
    container_name: banking-minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: banking
      MINIO_ROOT_PASSWORD: banking_dev

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

volumes:
  minio_data: